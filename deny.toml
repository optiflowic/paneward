# cargo-deny: https://embarkstudios.github.io/cargo-deny/
[graph]
all-features = true

[advisories]
# RustSec advisories; unmaintained crates are reported for direct and transitive deps
unmaintained = "all"
yanked = "deny"

[licenses]
# Permissive licenses compatible with distributing paneward under MIT
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "CC0-1.0",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.9
# The allow list covers likely future deps; do not warn about entries unused today
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
