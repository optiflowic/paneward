name: 🚀 CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  # No paths-ignore on pull requests: these jobs are required checks, and a
  # skipped required check would block docs-only pull requests from merging.
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the toolchain pinned in rust-toolchain.toml
      - name: 🦀 Install Rust toolchain
        run: rustup toolchain install

      - name: 🗂️ Cache Cargo
        uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3

      - name: 🖊️ Check formatting
        run: make fmt-check

      - name: 🔍 Run clippy
        run: make lint

  security:
    name: Security
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🦀 Install Rust toolchain
        run: rustup toolchain install

      - name: 🧰 Install cargo-deny
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-deny

      # Advisories (RustSec), licenses, banned crates and sources; see deny.toml
      - name: 🛡️ Run cargo-deny
        run: make deny

  build-test:
    name: Build & Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🦀 Install Rust toolchain
        run: rustup toolchain install

      - name: 🗂️ Cache Cargo
        uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3

      - name: 🧪 Test
        run: make test

      - name: 🏗️ Build
        run: make build
