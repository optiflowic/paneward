name: 🚀 CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  # No paths-ignore on pull requests: these jobs are required checks, and a
  # skipped required check would block docs-only pull requests from merging.
  pull_request:
    branches: [main]

# Deny everything by default; each job asks only for what it needs.
permissions: {}

# A new push to the same PR or branch cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the repository

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the toolchain pinned in rust-toolchain.toml
      - name: 🦀 Install Rust toolchain
        run: rustup toolchain install

      - name: 🗂️ Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: 🖊️ Check formatting
        run: make fmt-check

      - name: 🔍 Run clippy
        run: make lint

  security:
    name: Security
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the repository

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🦀 Install Rust toolchain
        run: rustup toolchain install

      # Installs the tools pinned in mise.toml (the single source of their versions)
      - name: 🧰 Install tools with mise
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.18

      # Advisories (RustSec), licenses, banned crates and sources; see deny.toml
      - name: 🛡️ Run cargo-deny
        run: make deny

  workflow-audit:
    name: Workflow Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the repository

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the tools pinned in mise.toml (the single source of their versions)
      - name: 🧰 Install tools with mise
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.18

      # Static security analysis of GitHub Actions workflows (permissions,
      # injection, credential persistence, unpinned actions, ...). The token
      # enables the online audits; it only reads public repository metadata.
      - name: 🔐 Run zizmor
        run: make audit
        env:
          GH_TOKEN: ${{ github.token }}

  build-test:
    name: Build & Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read # check out the repository

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🦀 Install Rust toolchain
        run: rustup toolchain install

      - name: 🗂️ Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: 🧪 Test
        run: make test

      - name: 🏗️ Build
        run: make build
