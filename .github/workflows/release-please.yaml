name: 📦 release-please

on:
  push:
    branches: [main]

# Deny everything by default; each job asks only for what it needs.
permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-latest
    # A run that is creating a release must not be cancelled.
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false
    # Uses the short-lived GITHUB_TOKEN on purpose: no long-lived secret to leak.
    # Release PRs opened with it do not trigger CI; they only bump versions and the
    # changelog, and are merged through the Ruleset bypass (pull requests only).
    permissions:
      contents: write # create release tags and GitHub releases
      issues: write # create and update the release labels (autorelease: pending/tagged)
      pull-requests: write # open and update the release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.tag.outputs.version }}
      commit: ${{ steps.tag.outputs.commit }}
      attest: ${{ steps.tag.outputs.attest }}
    steps:
      - name: 🚀 Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0

      # Provenance names this run's commit, so attest only when the tag is that commit.
      # Otherwise (a newer push's run created the release) attach binaries without it.
      - name: 🔗 Resolve the tag's commit
        id: tag
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG")
          commit=$(jq -r .object.sha <<<"$ref")
          if [[ "$(jq -r .object.type <<<"$ref")" == tag ]]; then
            commit=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$commit" --jq .object.sha)
          fi
          attest=true
          if [[ "$commit" != "$GITHUB_SHA" ]]; then
            attest=false
            echo "::warning::The release tag is not this run's commit: binaries get no provenance."
          fi
          {
            echo "version=${TAG#paneward-}"
            echo "commit=$commit"
            echo "attest=$attest"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.target }})
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          # Static musl binaries run on any distribution and in WSL.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
    # A cancelled build would leave the release without binaries.
    concurrency:
      group: ${{ github.workflow }}-build-${{ needs.release-please.outputs.tag_name }}-${{ matrix.target }}
      cancel-in-progress: false
    runs-on: ${{ matrix.os }}
    # Dependency build scripts run here: no token that can sign or publish.
    permissions:
      contents: read # check out the release commit
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - name: 📥 Checkout the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.commit }}
          persist-credentials: false

      # No cache: other runs could write to it (cache poisoning).
      - name: 🦀 Install Rust toolchain
        run: |
          rustup toolchain install
          rustup target add "$TARGET"

      - name: 🧰 Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install --yes musl-tools

      - name: 🏗️ Build
        run: cargo build --release --locked --target "$TARGET"

      - name: 📦 Package
        run: |
          archive="paneward-$VERSION-$TARGET.tar.gz"
          tar -czf "$archive" -C "target/$TARGET/release" paneward -C "$GITHUB_WORKSPACE" LICENSE
          if command -v sha256sum >/dev/null; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi

      - name: 📤 Upload the archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: paneward-*.tar.gz*
          if-no-files-found: error

  attest:
    name: Attest provenance
    needs: [release-please, build]
    if: needs.release-please.outputs.attest == 'true'
    concurrency:
      group: ${{ github.workflow }}-attest-${{ needs.release-please.outputs.tag_name }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      id-token: write # sign the build provenance attestation
      attestations: write # store the build provenance attestation
    steps:
      - name: 📥 Download the archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: 🔏 Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/paneward-*.tar.gz

  publish:
    name: Attach binaries
    needs: [release-please, build, attest]
    if: >-
      ${{ !cancelled() && needs.build.result == 'success'
      && contains(fromJSON('["success", "skipped"]'), needs.attest.result) }}
    concurrency:
      group: ${{ github.workflow }}-publish-${{ needs.release-please.outputs.tag_name }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload assets to the GitHub release
    steps:
      - name: 📥 Download the archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      # --clobber: "Re-run failed jobs" replaces assets of the failed attempt.
      - name: 🚀 Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" dist/* --clobber
