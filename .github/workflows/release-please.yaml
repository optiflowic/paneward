name: 📦 release-please

on:
  push:
    branches: [main]
  # Attaches binaries to a release that already exists, e.g. one created before
  # this workflow built them.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach binaries to (e.g. paneward-v0.1.0)
        required: true
        type: string

# Deny everything by default; each job asks only for what it needs.
permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  release-please:
    name: Release PR
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Release PR updates must not race each other; let the latest push win. Only
    # this job: a newer push must not cancel the build of a release just created.
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    # Uses the short-lived GITHUB_TOKEN on purpose: no long-lived secret to leak.
    # Release PRs opened with it do not trigger CI; they only bump versions and the
    # changelog, and are merged through the Ruleset bypass (pull requests only).
    permissions:
      contents: write # create release tags and GitHub releases
      issues: write # create and update the release labels (autorelease: pending/tagged)
      pull-requests: write # open and update the release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: 🚀 Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0

  release-tag:
    name: Release tag
    needs: release-please
    # Runs for a release just created, or a manual run (release-please is skipped then).
    if: >-
      !cancelled() && (github.event_name == 'workflow_dispatch'
      || needs.release-please.outputs.release_created == 'true')
    # Shares nothing with other runs, so no limit across runs: one group per run.
    concurrency:
      group: ${{ github.workflow }}-release-tag-${{ github.run_id }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      # The tag comes from user input on manual runs: check its shape before any job
      # uses it, and never echo it.
      - name: 🏷️ Validate the release tag
        id: tag
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
        run: |
          if [[ ! "$TAG" =~ ^paneward-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The tag must look like paneward-vX.Y.Z."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#paneward-}" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.target }})
    needs: release-tag
    # Without this, the skipped release-please job of a manual run would skip it too.
    if: ${{ !cancelled() && needs.release-tag.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          # Linux builds link musl statically, so they run on any distribution and in WSL.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
    # Runs for the same tag do not overlap. GitHub keeps at most one waiting job per
    # group and replaces an older waiting one, which is fine: both build the same tag.
    concurrency:
      group: ${{ github.workflow }}-build-${{ needs.release-tag.outputs.tag }}-${{ matrix.target }}
      cancel-in-progress: false
    runs-on: ${{ matrix.os }}
    # Build scripts and proc macros of dependencies run here, so this job gets no
    # token that can sign or publish anything.
    permissions:
      contents: read # check out the tagged source
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.release-tag.outputs.version }}
    steps:
      # A full ref: a branch with the same name as the tag must not be built instead.
      - name: 📥 Checkout the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.release-tag.outputs.tag }}
          persist-credentials: false

      # Installs the toolchain pinned in rust-toolchain.toml. No build cache: a
      # release binary must not be built from a cache other runs can write to.
      - name: 🦀 Install Rust toolchain
        run: |
          rustup toolchain install
          rustup target add "$TARGET"

      - name: 🧰 Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install --yes musl-tools

      - name: 🏗️ Build
        run: cargo build --release --locked --target "$TARGET"

      - name: 📦 Package
        run: |
          archive="paneward-$VERSION-$TARGET.tar.gz"
          tar -czf "$archive" -C "target/$TARGET/release" paneward -C "$GITHUB_WORKSPACE" LICENSE
          shasum -a 256 "$archive" > "$archive.sha256"

      - name: 📤 Upload the archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: paneward-*.tar.gz*
          if-no-files-found: error

  attest:
    name: Attest provenance
    needs: [release-tag, build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    concurrency:
      group: ${{ github.workflow }}-attest-${{ needs.release-tag.outputs.tag }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # Signing is kept out of the build job, where dependency code runs.
    permissions:
      id-token: write # sign the build provenance attestation
      attestations: write # store the build provenance attestation
    steps:
      - name: 📥 Download the archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: 🔏 Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/paneward-*.tar.gz

  publish:
    name: Attach binaries
    needs: [release-tag, attest]
    if: ${{ !cancelled() && needs.attest.result == 'success' }}
    concurrency:
      group: ${{ github.workflow }}-publish-${{ needs.release-tag.outputs.tag }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload assets to the GitHub release
    steps:
      - name: 📥 Download the archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      # --clobber lets a manual rerun replace the assets of an earlier run.
      - name: 🚀 Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-tag.outputs.tag }}
        run: gh release upload "$TAG" dist/* --clobber
