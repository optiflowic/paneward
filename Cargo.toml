[package]
name = "paneward"
version = "0.1.1"
edition = "2024"
rust-version = "1.99"
description = "Watch over the AI coding agents running in your terminal panes"
license = "MIT"
repository = "https://github.com/optiflowic/paneward"
readme = "README.md"
keywords = ["tui", "wezterm", "claude-code", "codex", "agent"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
notify = "8.2.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
strip = true
